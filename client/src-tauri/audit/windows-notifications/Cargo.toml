[package]
name = "tarocub-windows-notification-audit"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
tokio = { version = "=1.53.1", features = ["sync", "rt", "macros", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "Foundation_Metadata", "UI_Notifications", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem"] }

# Standalone audit crate, not a member of the application workspace.
[workspace]
