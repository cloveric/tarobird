<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob: https:; font-src data:; connect-src https: wss:; frame-src about:; base-uri 'none'; form-action 'none'"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe title="Plugin sandbox" sandbox="allow-scripts" referrerpolicy="no-referrer" allow="camera 'none'; microphone 'none'; geolocation 'none'; clipboard-read 'none'; clipboard-write 'none'"></iframe><script>
(() => {
  if (parent === window) return;
  const guest = document.querySelector("iframe");
  let initialized = false;
  addEventListener("message", (event) => {
    const data = event.data;
    if (!data || typeof data !== "object") return;
    if (event.source === parent) {
      if (data.type === "tarobird-plugin-init" && !initialized && typeof data.document === "string" && data.document.length < 16777216) {
        initialized = true;
        if (typeof data.title === "string" && data.title.length <= 200) guest.title = data.title;
        guest.srcdoc = data.document;
      } else if (initialized && data.protocol === "tarobird.plugin.v1" && guest.contentWindow) {
        guest.contentWindow.postMessage(data, "*");
      }
    } else if (initialized && event.source === guest.contentWindow && data.protocol === "tarobird.plugin.v1") {
      parent.postMessage(data, "*");
    }
  });
  parent.postMessage({ type: "tarobird-plugin-shell-ready" }, "*");
})();
</script></body></html>
