      <path d="M 14.6 19.6 C 17.4 17.4 22.4 17.8 25.2 20.8 C 23.6 24.2 19.2 25.8 15.8 23.4 C 14.8 22.4 14.4 21 14.6 19.6 Z"/>
    </g>
