<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaroBot · 图标设计候选</title>
<style>
:root { color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#252333; background:#f6f5f8 }
* { box-sizing:border-box }
body { margin:0; padding:48px 28px }
main { max-width:960px; margin:auto }
header { margin-bottom:32px }
small { font-size:12px; letter-spacing:.08em; color:#737081 }
h1 { margin:12px 0; font-size:30px; letter-spacing:-.035em }
p { color:#686473; line-height:1.7; margin:0 }
.candidates { display:grid; grid-template-columns:1fr 1fr; gap:24px }
article { min-width:0; padding:28px; background:#fff; border-radius:24px }
.hero { display:block; width:min(100%,240px); height:auto; margin:0 auto 28px; border-radius:23% }
h2 { margin:0 0 8px; font-size:20px }
h2 span { margin-left:8px; font-size:11px; font-weight:500; color:#665186; background:#f1ebf9; padding:4px 8px; border-radius:6px; vertical-align:middle }
.sizes { display:flex; align-items:flex-end; gap:26px; padding:28px 0 }
figure { margin:0; text-align:center }
figure img { display:block; border-radius:23%; margin:auto }
figcaption { margin-top:8px; font-size:11px; color:#85818e }
.context { margin-top:12px; padding:16px; border-radius:12px; display:flex; align-items:center; gap:12px; background:#f5f4f7 }
.context img { width:32px; height:32px; border-radius:8px }
.context strong { font-size:14px }
.context .meta { color:#777181; font-size:12px; margin-top:4px }
.dark { background:#23222a; color:#f2f0f5 }
.dark .meta { color:#aca6b7 }
footer { margin-top:28px; font-size:12px; color:#777181; line-height:1.8 }
@media(max-width:620px) { body {padding:24px 16px} .candidates {grid-template-columns:1fr} article {padding:24px} h1 {font-size:25px} }
</style>
<main>
<header><small>TAROBOT · GPT IMAGE · 2026.10.12</small><h1>一个更容易认出的 TaroBot</h1><p>两种图标方向，以及真实小尺寸下的表现。</p></header>
<div class="candidates">
<article>
<img class="hero" src="taro-bot-mascot.png" alt="紫色芋头 Bot 图标">
<h2>A · 芋头 Bot <span>推荐方向</span></h2>
<p>一个轮廓、两只眼睛。亲切，有自己的形象。</p>
<div class="sizes">
<figure><img src="taro-bot-mascot.png" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
<figure><img src="taro-bot-mascot.png" width="48" height="48" alt=""><figcaption>48 px</figcaption></figure>
<figure><img src="taro-bot-mascot.png" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
</div>
<div class="context"><img src="taro-bot-mascot.png" alt=""><div><strong>TaroBot</strong><div class="meta">你的 AI 工作伙伴</div></div></div>
<div class="context dark"><img src="taro-bot-mascot.png" alt=""><div><strong>TaroBot</strong><div class="meta">你的 AI 工作伙伴</div></div></div>
</article>
<article>
<img class="hero" src="conversation-t.png" alt="蓝底白色对话 T 图标">
<h2>B · 对话 T</h2>
<p>把名字融入对话符号。克制，清楚，偏工具感。</p>
<div class="sizes">
<figure><img src="conversation-t.png" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
<figure><img src="conversation-t.png" width="48" height="48" alt=""><figcaption>48 px</figcaption></figure>
<figure><img src="conversation-t.png" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
</div>
<div class="context"><img src="conversation-t.png" alt=""><div><strong>TaroBot</strong><div class="meta">你的 AI 工作伙伴</div></div></div>
<div class="context dark"><img src="conversation-t.png" alt=""><div><strong>TaroBot</strong><div class="meta">你的 AI 工作伙伴</div></div></div>
</article>
</div>
<footer>当前为设计候选，尚未替换安装包图标。圆角为页面预览效果；桌面 Dock、Android 自适应图标需要在定稿后分别制作、验证。</footer>
</main>
</html>
