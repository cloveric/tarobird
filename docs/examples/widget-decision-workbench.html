<section id="workbench">
  <p class="muted">演示数据 · 方案筛选与分步规划 · 本地交互</p>
  <div class="tabs" role="group" aria-label="查看内容">
    <button id="tab-options" aria-pressed="true">筛选方案</button>
    <button id="tab-plan" aria-pressed="false">制定计划</button>
    <button id="tab-flow" aria-pressed="false">了解流程</button>
  </div>
  <section id="view-options">
    <div class="grid">
      <label>安排方式<select id="mode"><option value="all">全部方案</option><option value="remote">远程</option><option value="onsite">现场</option></select></label>
      <label>预算上限 <output id="budget-value">5000</output> 元<input id="budget" type="range" min="1000" max="5000" step="500" value="5000"></label>
    </div>
    <p id="match-count" role="status"></p>
    <div id="matches" class="grid"></div>
    <p id="selection" role="status"></p>
  </section>
  <section id="view-plan" hidden>
    <p id="step-label" class="muted"></p>
    <form id="plan-form">
      <div id="step-one"><label>计划名称<input id="plan-name" name="name" required maxlength="80" placeholder="例如：周五产品讨论"></label><label>补充要求<textarea id="notes" name="notes" rows="3" maxlength="2000" placeholder="输入你希望保留的安排或问题"></textarea></label></div>
      <div id="step-two" hidden><p id="review"></p><p class="muted">这里只整理草稿。最终发送仍由你决定。</p></div>
      <div class="row"><button id="back" type="button" hidden>上一步</button><button id="next" type="submit">下一步</button><button id="compose" type="button" hidden>填入输入框</button></div>
    </form>
    <p id="receipt" role="status"></p>
  </section>
  <section id="view-flow" hidden>
    <p>点选一个环节，查看它与前后步骤的关系。</p>
    <ol class="flow" aria-label="规划流程">
      <li><button data-stage="0" aria-pressed="true">1 确定目标</button></li>
      <li><button data-stage="1" aria-pressed="false">2 比较方案</button></li>
      <li><button data-stage="2" aria-pressed="false">3 安排执行</button></li>
      <li><button data-stage="3" aria-pressed="false">4 回顾调整</button></li>
    </ol>
    <div class="card"><h3 id="stage-title"></h3><p id="stage-detail"></p><div class="row"><button id="stage-prev">上一环节</button><button id="stage-next">下一环节</button></div></div>
  </section>
</section>
<style>
#workbench{max-width:820px;margin:auto}#workbench .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}#workbench select,#workbench input:not([type=checkbox]),#workbench textarea{display:block;width:100%;margin-top:5px}#workbench #match-count{margin:14px 0 8px}#workbench #selection{margin-top:12px}#workbench .choice{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:12px}#workbench .choice[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}#workbench .choice small{color:var(--muted)}#workbench form label{display:block;margin-bottom:14px}#workbench .flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;list-style:none;padding:0}#workbench .flow li{min-width:0}#workbench .flow button{width:100%;height:100%}#workbench .flow button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}#workbench #stage-detail{min-height:4em}#workbench #receipt{margin-top:12px}@media(max-width:480px){#workbench .flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script>
const $=id=>document.getElementById(id), options=[{id:'a',name:'远程工作坊：跨城市团队的轻量协作安排',mode:'remote',cost:1500,days:1},{id:'b',name:'现场共创：半天讨论与可执行计划',mode:'onsite',cost:2500,days:1},{id:'c',name:'两天深入交流与成果回顾',mode:'onsite',cost:4500,days:2}], stages=[['确定目标','先写下这次活动要解决的问题。目标明确后，再比较不同方案，避免只按价格决定。'],['比较方案','结合安排方式、预算和天数筛选。选中的方案会带到“制定计划”，但不会替你发送消息。'],['安排执行','确定负责人、时间和需要准备的材料。发送前仍可回到上一步修改计划。'],['回顾调整','记录执行结果，判断目标是否达成。把发现的问题带回下一次规划。']];
let selected='a',view='options',step=0,stage=0;
const initial=window.tarobot?.state?.initial;
if(initial&&typeof initial==='object'){if(options.some(o=>o.id===initial.selected))selected=initial.selected;if(['options','plan','flow'].includes(initial.view))view=initial.view;if(initial.step===1)step=1;if(Number.isInteger(initial.stage)&&initial.stage>=0&&initial.stage<4)stage=initial.stage;if(['all','remote','onsite'].includes(initial.mode))$('mode').value=initial.mode;if(Number.isFinite(initial.budget)&&initial.budget>=1000&&initial.budget<=5000)$('budget').value=String(initial.budget);if(typeof initial.name==='string')$('plan-name').value=initial.name.slice(0,80);if(typeof initial.notes==='string')$('notes').value=initial.notes.slice(0,2000)}
function save(){window.tarobot?.state?.set({selected,view,step,stage,mode:$('mode').value,budget:Number($('budget').value),name:$('plan-name').value,notes:$('notes').value})}
function draw(){const mode=$('mode').value,budget=Number($('budget').value),matches=options.filter(o=>(mode==='all'||o.mode===mode)&&o.cost<=budget);$('budget-value').textContent=String(budget);$('match-count').textContent=matches.length+' 个方案符合条件';$('matches').textContent='';for(const o of matches){const b=document.createElement('button');b.type='button';b.className='choice';b.dataset.choice=o.id;b.setAttribute('aria-pressed',String(selected===o.id));const name=document.createElement('span');name.textContent=o.name;const detail=document.createElement('small');detail.textContent=o.cost+' 元 · '+o.days+' 天';b.appendChild(name);b.appendChild(detail);$('matches').appendChild(b)}const chosen=options.find(o=>o.id===selected);$('selection').textContent='当前选择：'+chosen.name+(matches.some(o=>o.id===selected)?'':'（不在当前筛选结果中）');for(const key of ['options','plan','flow']){$('tab-'+key).setAttribute('aria-pressed',String(view===key));$('view-'+key).hidden=view!==key}$('step-label').textContent='第 '+(step+1)+' 步，共 2 步';$('step-one').hidden=step!==0;$('step-two').hidden=step!==1;$('back').hidden=step===0;$('next').hidden=step===1;$('compose').hidden=step!==1||!window.tarobot?.prompt?.compose;$('review').textContent=$('plan-name').value+'：'+chosen.name+'，'+chosen.cost+' 元。'+$('notes').value;document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.stage)===stage)));$('stage-title').textContent=stages[stage][0];$('stage-detail').textContent=stages[stage][1];$('stage-prev').disabled=stage===0;$('stage-next').disabled=stage===3;save()}
for(const key of ['options','plan','flow'])$('tab-'+key).onclick=()=>{view=key;draw()};$('mode').onchange=draw;$('budget').oninput=draw;$('matches').onclick=e=>{const button=e.target.closest('[data-choice]');if(button){selected=button.dataset.choice;draw()}};
$('plan-name').oninput=save;$('notes').oninput=save;$('plan-form').onsubmit=e=>{e.preventDefault();if($('plan-name').value.trim()){step=1;draw()}};$('back').onclick=()=>{step=0;draw()};$('compose').onclick=async()=>{$('receipt').textContent=await tarobot.prompt.compose('请完善这份计划：'+$('review').textContent)?'已填入，未自动发送。':'未能填入，请稍后重试。'};
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=Number(b.dataset.stage);draw()});$('stage-prev').onclick=()=>{stage=Math.max(0,stage-1);draw()};$('stage-next').onclick=()=>{stage=Math.min(3,stage+1);draw()};draw();
</script>
