title = "Repository secret scanning"
[extend]
useDefault = true
[[allowlists]]
description = "Reviewed upstream Design JavaScript shortcut comparison, not a credential"
condition = "AND"
paths = ['^client/vendor/baoyu-design/editor/assets/index-DyKwtQBI\.js$', '^client/vendor/baoyu-design/editor/assets/index-CYLuwRoc\.js$']
regexTarget = "match"
regexes = ['\Aaria-keyshortcuts":J\.shortcut===void \z']
[[allowlists]]
description = "Reviewed upstream Slides JavaScript shortcut comparison, not a credential"
condition = "AND"
paths = ['^client/vendor/baoyu-slides/editor/assets/index-S9woRl4b\.js$', '^client/vendor/baoyu-slides/editor/assets/index-7OEzB54c\.js$']
regexTarget = "match"
regexes = ['\Aaria-keyshortcuts":te\.shortcut===void \z']
[[allowlists]]
description = "Exact non-credential strings in the Design scanner regression itself"
condition = "AND"
paths = ['^scripts/privacy-guards\.node-test\.mjs$']
regexTarget = "match"
regexes = ['\Aaria-keyshortcuts":J\.shortcut===void \z', '\AapiKey="J\.shortcut===void"\z', '\Aaria-keyshortcuts":te\.shortcut===void \z', '\AapiKey="te\.shortcut===void"\z']
[[allowlists]]
description = "Reviewed upstream Slides compiler keyboard modifier constant, not a credential"
condition = "AND"
paths = ['^client/vendor/baoyu-slides/editor/node/compiler\.cjs$']
regexTarget = "match"
regexes = ['\AmodifierKeys: MODIFIER_KEYS2\z']
[[allowlists]]
description = "Deterministic Ed25519 public-key fixture (bytes 00 through 1f); no private key"
regexTarget = "secret"
regexes = ['^MCowBQYDK2VwAyEAAAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=$']
[[allowlists]]
description = "Fixed Ed25519 SPKI header in the historical synthetic pairing QR test; no key bytes"
condition = "AND"
paths = ['^tests/client-pairing-qr\.test\.ts$']
regexTarget = "secret"
regexes = ['^MCowBQYDK2VwAyEA$']

