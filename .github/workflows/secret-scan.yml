name: Secret scanning
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir -p gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Test privacy guards
        run: node --test scripts/privacy-guards.node-test.mjs scripts/check-upload-privacy.test.mjs scripts/release-version.test.mjs
      - name: Scan full reachable history
        run: bash scripts/check-secrets.sh history
      - name: Check unified product versions
        run: node scripts/release-version.mjs check
      - name: Scan new commit metadata and content
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          base=EMPTY
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = push ] && [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            base="$(git rev-parse origin/main)"
          fi
          node scripts/check-upload-privacy.mjs range "$base" "$head"
      - name: Scan pull request title and body
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-privacy.mjs
